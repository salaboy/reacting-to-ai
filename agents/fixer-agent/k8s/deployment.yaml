apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixer-agent
  labels:
    app: fixer-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixer-agent
  template:
    metadata:
      labels:
        app: fixer-agent
    spec:
      containers:
        - name: fixer-agent
          image: ghcr.io/salaboy/reacting-to-ai/fixer-agent:main
          ports:
            - containerPort: 8081
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fixer-agent-secrets
                  key: anthropic-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fixer-agent-secrets
                  key: github-token
            - name: REPO_URL
              value: https://github.com/salaboy/reacting-to-ai.git
            - name: OTEL_SERVICE_NAME
              value: fixer-agent
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=reacting-to-ai
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
