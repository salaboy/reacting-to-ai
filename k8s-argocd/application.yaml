apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homebanking-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: homebanking=ghcr.io/salaboy/homebanking-app:main
    argocd-image-updater.argoproj.io/homebanking.update-strategy: digest
    argocd-image-updater.argoproj.io/homebanking.pull-secret: pullsecret:argocd/ghcr-creds
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/salaboy/reacting-to-ai.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
