apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: homebanking-app
  labels:
    app: homebanking-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: homebanking-app
  template:
    metadata:
      labels:
        app: homebanking-app
    spec:
      containers:
        - name: homebanking-app
          image: ghcr.io/salaboy/homebanking-app:main
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
  strategy:
    blueGreen:
      activeService: homebanking-app
      previewService: homebanking-app-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
