mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib

presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi
extraEnvs:
  - name: DASH0_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-authorization-token
  - name: DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-grpc-hostname
  - name: DASH0_ENDPOINT_OTLP_GRPC_PORT
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-grpc-port
  - name: DASH0_DATASET
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-dataset

ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    prometheus/argo:
      config:
        scrape_configs:
          - job_name: argocd-application-controller
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argocd-application-controller-metrics.argocd.svc.cluster.local:8082
          - job_name: argocd-server
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argocd-server-metrics.argocd.svc.cluster.local:8083
          - job_name: argocd-repo-server
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argocd-repo-server-metrics.argocd.svc.cluster.local:8084
          - job_name: argocd-applicationset-controller
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080
          - job_name: argocd-notifications-controller
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argocd-notifications-controller-metrics.argocd.svc.cluster.local:9001
          - job_name: argo-rollouts
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090

  connectors:
    spanmetrics:
      dimensions:
        - name: http.method
        - name: http.status_code
        - name: http.route

  processors:
    batch:
      timeout: 10s
      send_batch_size: 1024

  exporters:
    otlp/jaeger:
      endpoint: jaeger-collector.default.svc.cluster.local:4317
      tls:
        insecure: true

    otlp/dash0:
      endpoint: ${DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME}:${DASH0_ENDPOINT_OTLP_GRPC_PORT}
      headers:
        Authorization: Bearer ${DASH0_AUTH_TOKEN}
        Dash0-Dataset: ${DASH0_DATASET}
      tls:
        insecure: false

    prometheus:
      endpoint: 0.0.0.0:8889

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/jaeger, otlp/dash0, spanmetrics]

      metrics:
        receivers: [otlp, spanmetrics, prometheus/argo]
        processors: [batch]
        exporters: [prometheus, otlp/dash0]

      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/dash0]
